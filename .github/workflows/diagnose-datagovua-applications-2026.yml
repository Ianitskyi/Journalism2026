name: Diagnose data.gov.ua applications dataset (updated 2026-08-20)

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Перевіряє
# датасет МОН "Дані про заяви вступників до закладів вищої освіти
# (знеособлені дані)" — метадані оновлені 2026-08-20, схоже на актуальні
# дані вступної кампанії 2026 року.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-datagovua-applications-2026.mjs
        timeout-minutes: 5
