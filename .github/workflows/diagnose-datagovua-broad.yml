name: Diagnose data.gov.ua broader search for EDBO admissions data

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Попередній запит
# "ЄДЕБО" дав лише застарілий датасет (2012-2021). Тут шукаємо ширшими
# ключовими словами і перелічуємо всі датасети організацій МОН/ЄДЕБО з
# датою останнього оновлення, щоб знайти щось актуальне за 2025-2026.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-datagovua-broad.mjs
        timeout-minutes: 5
