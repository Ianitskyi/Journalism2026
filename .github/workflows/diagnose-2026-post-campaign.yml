name: Diagnose vstup.edbo.gov.ua post-campaign state

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Перевіряє, чи
# живий vstup.edbo.gov.ua (без переїзду на vstup2026) уже віддає дані без
# Cloudflare після завершення вступної кампанії 2026.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-2026-post-campaign.mjs
        timeout-minutes: 5
