name: Diagnose Bing search results for 2026 admissions

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Попередня спроба
# отримала від Bing статус 200, але специфічний regex-парсер результатів
# нічого не знайшов. Тут витягуємо всі зовнішні посилання узагальненим
# регексом, щоб побачити реальні результати пошуку.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-bing-search.mjs
        timeout-minutes: 5
