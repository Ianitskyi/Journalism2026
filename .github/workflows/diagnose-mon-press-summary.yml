name: Diagnose MON press summary for 2026 admissions

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Перевіряє, чи
# публікує МОН/ЄДЕБО прес-звіти чи новини з підсумками вступної кампанії
# 2026 року (готові агреговані цифри замість сирих даних).
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-mon-press-summary.mjs
        timeout-minutes: 5
