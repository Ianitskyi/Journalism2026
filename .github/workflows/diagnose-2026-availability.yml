name: Diagnose 2026 live EDBO data availability

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Перевіряє, чи
# вже можна автоматично отримати дані поточної (2026) вступної кампанії,
# чи пошук пропозицій досі захищений Cloudflare Turnstile.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-2026-availability.mjs
        timeout-minutes: 5
