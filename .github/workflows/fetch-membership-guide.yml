name: Fetch Membership Guide handbook (scratch)

# Службовий workflow: сесія Claude Code не має мережі назовні, а GitHub
# Actions runner — має. Обходить membershipguide.org/handbook та всі
# сторінки під /handbook, витягує чистий текстовий контент (без nav/footer)
# у scratch/membership-guide-raw/ на цій гілці. Переклад дозволено власником
# прав (лист Ariel Zirulnick, MPP, 05.10.2025, CC Jay Rosen + Lenfest
# Institute) — це лише робочі матеріали для подальшого перекладу.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Crawl handbook
        run: node scripts/fetch-membership-guide.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/membership-guide-raw
          git diff --cached --quiet || git commit -m "chore: fetch membershipguide.org/handbook raw content"
          git push
