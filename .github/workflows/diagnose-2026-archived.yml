name: Diagnose vstup2026.edbo.gov.ua availability

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Чергова
# перевірка, чи з'явився архівний субдомен vstup2026.edbo.gov.ua.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-2026-archived.mjs
        timeout-minutes: 5
