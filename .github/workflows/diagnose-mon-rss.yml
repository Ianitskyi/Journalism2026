name: Diagnose MON RSS and Bing search for 2026 admissions

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Попередня спроба
# провалилась технічно (mon.gov.ua 403, DuckDuckGo 202 без результатів).
# Пробуємо RSS-стрічку mon.gov.ua та Bing HTML-пошук.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-mon-rss.mjs
        timeout-minutes: 5
