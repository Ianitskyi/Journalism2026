name: Update EDBO data

# 2026 рік уже імпортовано з підсумкового офіційного XLSX, тому щоденний
# розклад більше не потрібен. workflow_dispatch лишено для діагностики
# колишнього оперативного контуру; пошук нових пропозицій він не виконує.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-edbo-current.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Оновлення даних ЄДЕБО 2026"
          git push
