name: Diagnose data.gov.ua entrant CSV year coverage

# ТИМЧАСОВИЙ діагностичний workflow — нічого не комітить. Перевіряє повний
# вміст OPENDATA_02_ENTRANT.csv на data.gov.ua: які роки покриває і чи є
# рядки для журналістики (061).
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-datagovua-entrant-years.mjs
        timeout-minutes: 5
