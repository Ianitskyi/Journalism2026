name: Fetch community-guide photo candidates (scratch)

# ТИМЧАСОВИЙ службовий workflow. Сесія Claude Code в цьому проєкті не має
# мережевого доступу до довільних зовнішніх сайтів, а GitHub Actions
# runner — має. Шукає та качає кандидатів у вищій якості для двох
# ілюстративних фото зі спецпроєкту community-guide (Occupy Wall Street /
# Defending Rights & Dissent та Black Lives Matter / Joe Yates, Unsplash),
# складає їх у scratch/photos/ на цій гілці для подальшого відбору.
on:
  push:
    paths:
      - 'scratch/photo-fetch-trigger'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch candidates
        run: |
          set -e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p scratch/photos/blm scratch/photos/occupy

          echo "== Unsplash blocks curl entirely (Authorization required), skipping =="

          echo "== Wikimedia Commons search: Black Lives Matter Atlanta =="
          curl -sS -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&list=search&srnamespace=6&srlimit=20&srsearch=Black%20Lives%20Matter%20Atlanta%202020&format=json" \
            -o scratch/photos/blm/wm-search.json || echo "wm search failed"
          if [ -s scratch/photos/blm/wm-search.json ]; then
            jq -r '.query.search[]?.title' scratch/photos/blm/wm-search.json > scratch/photos/blm/wm-titles.txt || true
            cat scratch/photos/blm/wm-titles.txt || true
            i=0
            while read -r title; do
              i=$((i+1))
              enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$title")
              curl -sS -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&titles=${enc}&prop=imageinfo&iiprop=url|extmetadata|size&format=json" \
                -o "scratch/photos/blm/wm-meta-${i}.json" || echo "  meta failed for $title"
              url=$(jq -r '.query.pages[]?.imageinfo[0]?.url // empty' "scratch/photos/blm/wm-meta-${i}.json" 2>/dev/null)
              mime=$(jq -r '.query.pages[]?.imageinfo[0]?.mime // empty' "scratch/photos/blm/wm-meta-${i}.json" 2>/dev/null)
              echo "[$i] $title -> $url ($mime)"
              if [ -n "$url" ] && [[ "$mime" == image/* ]]; then
                ext="${url##*.}"
                curl -sS -L -A "$UA" "$url" -o "scratch/photos/blm/wm-${i}.${ext}" || echo "  download failed"
              fi
            done < scratch/photos/blm/wm-titles.txt
          fi

          echo "== Defending Rights & Dissent Occupy article =="
          curl -sS -L -A "$UA" "https://www.rightsanddissent.org/news/the-fbi-and-occupy-the-surveillance-and-suppression-of-occupy-wall-street/" \
            -o scratch/photos/occupy/article.html || echo "article fetch failed"
          if [ -s scratch/photos/occupy/article.html ]; then
            grep -oE '(https?:)?//[^"'"'"' ]+\.(jpg|jpeg|png|webp)[^"'"'"' ]*' scratch/photos/occupy/article.html | sort -u > scratch/photos/occupy/img-urls.txt || true
            cat scratch/photos/occupy/img-urls.txt || true
            i=0
            while read -r u; do
              i=$((i+1))
              full="$u"
              case "$full" in //*) full="https:$full" ;; esac
              echo "downloading $full"
              curl -sS -L -A "$UA" "$full" -o "scratch/photos/occupy/${i}.img" || echo "  failed"
            done < scratch/photos/occupy/img-urls.txt
          fi

          find scratch/photos -type f | xargs -I{} sh -c 'echo {}: $(file -b "{}")' || true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/photos
          git diff --cached --quiet || git commit -m "Fetch community-guide photo candidates (scratch)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
