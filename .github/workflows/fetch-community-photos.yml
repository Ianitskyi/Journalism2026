name: Fetch community-guide photo candidates (scratch)

# ТИМЧАСОВИЙ службовий workflow. Сесія Claude Code в цьому проєкті не має
# мережевого доступу до довільних зовнішніх сайтів, а GitHub Actions
# runner — має. Шукає та качає кандидатів у вищій якості для двох
# ілюстративних фото зі спецпроєкту community-guide (Occupy Wall Street /
# Defending Rights & Dissent та Black Lives Matter / Joe Yates, Unsplash),
# складає їх у scratch/photos/ на цій гілці для подальшого відбору.
on:
  push:
    paths:
      - 'scratch/photo-fetch-trigger'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch candidates
        run: |
          set -e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p scratch/photos/blm scratch/photos/occupy

          echo "== Joe Yates (Unsplash) profile page (HTML) =="
          curl -sS -A "$UA" "https://unsplash.com/@josephyates_" -o scratch/photos/blm/profile.html || echo "profile fetch failed"
          if [ -s scratch/photos/blm/profile.html ]; then
            grep -oE 'https://images\.unsplash\.com/[^"\\]+' scratch/photos/blm/profile.html | sort -u > scratch/photos/blm/cdn-urls.txt || true
            wc -l scratch/photos/blm/cdn-urls.txt || true
            i=0
            while read -r u; do
              i=$((i+1))
              echo "downloading $u"
              curl -sS -A "$UA" "$u" -o "scratch/photos/blm/profile-${i}.img" || echo "  failed"
            done < scratch/photos/blm/cdn-urls.txt
          fi

          echo "== Unsplash search page (HTML) fallback: black lives matter atlanta =="
          curl -sS -A "$UA" "https://unsplash.com/s/photos/black-lives-matter-atlanta" -o scratch/photos/blm/search.html || echo "search fetch failed"
          if [ -s scratch/photos/blm/search.html ]; then
            grep -oE 'https://images\.unsplash\.com/[^"\\]+' scratch/photos/blm/search.html | sort -u > scratch/photos/blm/search-cdn-urls.txt || true
            wc -l scratch/photos/blm/search-cdn-urls.txt || true
            i=0
            while read -r u; do
              i=$((i+1))
              echo "downloading $u"
              curl -sS -A "$UA" "$u" -o "scratch/photos/blm/search-${i}.img" || echo "  failed"
            done < scratch/photos/blm/search-cdn-urls.txt
          fi

          echo "== Defending Rights & Dissent Occupy article =="
          curl -sS -L -A "$UA" "https://www.rightsanddissent.org/news/the-fbi-and-occupy-the-surveillance-and-suppression-of-occupy-wall-street/" \
            -o scratch/photos/occupy/article.html || echo "article fetch failed"
          if [ -s scratch/photos/occupy/article.html ]; then
            grep -oE '(https?:)?//[^"'"'"' ]+\.(jpg|jpeg|png|webp)[^"'"'"' ]*' scratch/photos/occupy/article.html | sort -u > scratch/photos/occupy/img-urls.txt || true
            cat scratch/photos/occupy/img-urls.txt || true
            i=0
            while read -r u; do
              i=$((i+1))
              full="$u"
              case "$full" in //*) full="https:$full" ;; esac
              echo "downloading $full"
              curl -sS -L -A "$UA" "$full" -o "scratch/photos/occupy/${i}.img" || echo "  failed"
            done < scratch/photos/occupy/img-urls.txt
          fi

          find scratch/photos -type f | xargs -I{} sh -c 'echo {}: $(file -b "{}")' || true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/photos
          git diff --cached --quiet || git commit -m "Fetch community-guide photo candidates (scratch)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
