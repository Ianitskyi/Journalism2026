name: Fetch community-guide photo candidates (scratch)

# ТИМЧАСОВИЙ службовий workflow. Сесія Claude Code в цьому проєкті не має
# мережевого доступу до довільних зовнішніх сайтів, а GitHub Actions
# runner — має. Шукає та качає кандидатів у вищій якості для двох
# ілюстративних фото зі спецпроєкту community-guide (Occupy Wall Street /
# Defending Rights & Dissent та Black Lives Matter / Joe Yates, Unsplash),
# складає їх у scratch/photos/ на цій гілці для подальшого відбору.
on:
  push:
    paths:
      - 'scratch/photo-fetch-trigger'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch candidates
        run: |
          set -e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p scratch/photos/blm scratch/photos/occupy

          echo "== Unsplash blocks curl entirely (Authorization required), skipping =="

          echo "== Wikimedia Commons: curated Atlanta BLM candidates (from prior search) =="
          declare -a WM_URLS=(
            "https://upload.wikimedia.org/wikipedia/commons/1/10/Atlanta_Police_and_Black_Lives_Matter_detail%2C_from-_Hold_the_Line_-_49964334728_%28cropped%29.jpg"
            "https://upload.wikimedia.org/wikipedia/commons/7/7a/Atlanta_Police_Department_and_Black_Lives_Matter_detail%2C_from-_Hold_the_Line_-_49965120087_%28cropped%29.jpg"
            "https://commons.wikimedia.org/wiki/Special:FilePath/Hold%20the%20Line%20-%2049964334728.jpg"
            "https://commons.wikimedia.org/wiki/Special:FilePath/Hold%20the%20Line%20-%2049965120077.jpg"
            "https://commons.wikimedia.org/wiki/Special:FilePath/Hold%20the%20Line%20-%2049965120087.jpg"
            "https://commons.wikimedia.org/wiki/Special:FilePath/Keeping%20watch%20at%20Centennial%20Park%20-%2049959812628.jpg"
            "https://commons.wikimedia.org/wiki/Special:FilePath/Memorial%20for%20Rayshard%20Brooks%20outside%20burnt%20down%20Wendys.JPG"
          )
          i=0
          for u in "${WM_URLS[@]}"; do
            i=$((i+1))
            echo "downloading $u"
            curl -sS -L -A "$UA" "$u" -o "scratch/photos/blm/wm-${i}.jpg" || echo "  failed"
          done

          echo "== Wikimedia metadata for the two chosen candidates =="
          curl -sS -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&titles=File%3AAtlanta_Police_and_Black_Lives_Matter_detail%2C_from-_Hold_the_Line_-_49964334728_(cropped).jpg&prop=imageinfo&iiprop=extmetadata&format=json" \
            -o scratch/photos/blm/wm-1-meta.json || echo "meta1 failed"
          curl -sS -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&titles=File%3AAtlanta_Police_Department_and_Black_Lives_Matter_detail%2C_from-_Hold_the_Line_-_49965120087_(cropped).jpg&prop=imageinfo&iiprop=extmetadata&format=json" \
            -o scratch/photos/blm/wm-2-meta.json || echo "meta2 failed"

          echo "== Defending Rights & Dissent Occupy article =="
          curl -sS -L -A "$UA" "https://www.rightsanddissent.org/news/the-fbi-and-occupy-the-surveillance-and-suppression-of-occupy-wall-street/" \
            -o scratch/photos/occupy/article.html || echo "article fetch failed"
          if [ -s scratch/photos/occupy/article.html ]; then
            grep -oE '(https?:)?//[^"'"'"' ]+\.(jpg|jpeg|png|webp)[^"'"'"' ]*' scratch/photos/occupy/article.html | sort -u > scratch/photos/occupy/img-urls.txt || true
            cat scratch/photos/occupy/img-urls.txt || true
            i=0
            while read -r u; do
              i=$((i+1))
              full="$u"
              case "$full" in //*) full="https:$full" ;; esac
              echo "downloading $full"
              curl -sS -L -A "$UA" "$full" -o "scratch/photos/occupy/${i}.img" || echo "  failed"
            done < scratch/photos/occupy/img-urls.txt
          fi

          find scratch/photos -type f | xargs -I{} sh -c 'echo {}: $(file -b "{}")' || true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch/photos
          git diff --cached --quiet || git commit -m "Fetch community-guide photo candidates (scratch)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
